# Example: track whether a change to your agent setup helped or hurt.
#
# Copy this into your own repository. It expects:
#   - tasks/pinned.jsonl       a frozen task set, committed
#   - results/baseline.jsonl   results from before the change, committed
#   - secrets.ANTHROPIC_API_KEY
#
# Comparing against a re-mined task set tells you nothing, so the task set is
# pinned and only refreshed deliberately.
name: groundhog regression

on:
  pull_request:
    paths:
      # Run when the agent setup changes -- that is when the answer can differ.
      - "CLAUDE.md"
      - "prompts/**"
      - ".groundhog/**"
  schedule:
    - cron: "0 6 * * 1"   # weekly full run, Mondays
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mining needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Groundhog
        run: pip install git+https://github.com/abhinavsv3/groundhog

      - name: Cache the repo environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/groundhog
          key: groundhog-env-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}

      - name: Run the benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m groundhog run . \
            --models "${{ vars.GROUNDHOG_MODEL || 'anthropic:claude-opus-5' }}" \
            --tasks tasks/pinned.jsonl \
            --repeats 3 \
            --out results/current.jsonl

      - name: Compare against baseline
        run: |
          python -m groundhog compare \
            results/baseline.jsonl results/current.jsonl \
            --label-a baseline --label-b current \
            --fail-on-regression \
            --json results/comparison.json

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groundhog-results
          path: results/
