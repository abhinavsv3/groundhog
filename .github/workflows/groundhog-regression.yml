# Example: track whether a change to your agent setup helped or hurt.
#
# Copy this into your own repository. It expects:
#   - tasks/pinned.jsonl       a frozen task set, committed
#   - results/baseline.jsonl   results from before the change, committed
#   - a key for the model or agent you use
#
# Comparing against a re-mined task set tells you nothing, so the task set is
# pinned and only refreshed deliberately. See docs/ci.md.
name: groundhog regression

on:
  pull_request:
    paths:
      # Run when the agent setup changes -- that is when the answer can differ.
      - "CLAUDE.md"
      - "prompts/**"
      - ".groundhog/**"
  schedule:
    - cron: "0 6 * * 1"   # weekly full run, Mondays
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tasks reference commits; the history must be there

      - uses: abhinavsv3/groundhog@v1
        with:
          tasks: tasks/pinned.jsonl
          baseline: results/baseline.jsonl
          models: ${{ vars.GROUNDHOG_MODEL || 'anthropic:claude-sonnet-5' }}
          repeats: 3
          jobs: 4
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
