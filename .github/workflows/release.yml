# Publish to PyPI on a version tag, with trusted publishing: no token in the
# repo. One-time setup on pypi.org: project "groundhog-eval" -> Publishing ->
# add GitHub publisher (owner abhinavsv3, repo groundhog, workflow
# release.yml, environment pypi). Then:
#
#   git tag v0.2.0 && git push --tags
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: |
          # The wheel must run the demo on its own: that is the whole promise.
          uvx --from dist/*.whl groundhog --version
          uvx --from dist/*.whl groundhog demo --limit 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
