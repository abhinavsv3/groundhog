[project]
name = "groundhog"
version = "0.1.0"
description = "Replay your git history as a regression test for coding agents"
authors = [{ name = "Abhinav" }]
keywords = ["benchmark", "llm", "evaluation", "coding-agents", "swe-bench"]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
groundhog = "groundhog.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["groundhog"]

[tool.setuptools.package-data]
groundhog = ["template.html"]
