[project]
name = "groundhog"
version = "0.1.0"
description = "Turn any repo's git history into a coding-model benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["groundhog"]
