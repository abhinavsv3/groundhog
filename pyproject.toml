[project]
name = "groundhog-eval"
version = "0.2.0"
description = "Replay your git history as a regression test for coding agents"
authors = [{ name = "Abhinav S V" }]
keywords = ["benchmark", "llm", "evaluation", "coding-agents", "swe-bench", "agent-evaluation"]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/abhinavsv3/groundhog"
Repository = "https://github.com/abhinavsv3/groundhog"
Issues = "https://github.com/abhinavsv3/groundhog/issues"
Study = "https://scalingthoughts.com/groundhog/study.html"

[project.scripts]
groundhog = "groundhog.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["groundhog"]

[tool.setuptools.package-data]
groundhog = ["template.html"]
